[package]
name = "nostr-faucet-e2e-test"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "End-to-end scenarios for nostr-faucet against locally spun chains."
publish = false

[dependencies]
dln-e2e-harness = { git = "https://github.com/DarkWebDivingClub/diamond-x-e2e-test.git", branch = "master" }

nostr-sdk = { git = "https://github.com/dukeh3/nostr.git", rev = "9ac9adc2" }
nostr-ln = { git = "https://github.com/DarkWebDivingClub/nostr-ln.git", branch = "master" }

tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-util"] }
anyhow = "1"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
